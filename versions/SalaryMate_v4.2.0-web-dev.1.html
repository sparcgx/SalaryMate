<title>SalaryMate v4.2.0-web-dev.1｜Glass UI Foundation</title>
<style>












/* v0.6.8 Write Integrity */
.embedded-history-import{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px;margin:10px 0}
.embedded-history-import-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.embedded-history-import-head span{display:block;color:var(--muted);font-size:var(--fs-8);margin-top:3px}
.embedded-history-import-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.embedded-history-import-state{margin-top:8px}
.task-launcher{margin-bottom:10px}
.task-launcher-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}
.task-launcher-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.task-card{
 appearance:none;border:1px solid var(--line);border-radius:12px;background:var(--panel2);
 display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:8px;
 text-align:left;padding:11px 12px;cursor:pointer;color:inherit
}
.task-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.task-icon{width:38px;height:38px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-weight:900;font-size:var(--fs-14)}
.task-main b,.task-main small{display:block}.task-main b{font-size:var(--fs-11)}.task-main small{font-size:var(--fs-8);color:var(--muted);margin-top:2px}
.task-arrow{font-size:24px;color:var(--muted)}
.dashboard-layout-lowfreq{display:none!important}
.simplified-actions{align-items:center}
.workbench-more{position:relative}
.workbench-more>summary{list-style:none;cursor:pointer}.workbench-more>summary::-webkit-details-marker{display:none}
.workbench-more-menu{
 position:absolute;z-index:20;right:0;top:calc(100% + 5px);min-width:180px;padding:7px;
 display:grid;gap:5px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 8px 30px rgba(0,0,0,.12)
}
.workbench-more-menu .btn{width:100%;text-align:left}
.workbench-detail{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.workbench-detail>summary{cursor:pointer;padding:9px 11px;font-weight:900;color:var(--muted)}
.workbench-detail-body{padding:0 9px 9px}
#settingsPanel{display:flex!important;flex-direction:column}
#settingsPanel .company-settings-card{order:1}
#settingsPanel .local-data-cleanup-card{order:9}
.settings-maintenance-details>summary{cursor:pointer;font-weight:900;padding:8px 0}
.settings-maintenance-body{padding-top:6px}
@media(max-width:780px){
 .task-launcher-grid{grid-template-columns:1fr}
 .workbench-more-menu{position:fixed;left:12px;right:12px;top:auto}
}

/* v0.6.2 Functional Consolidation & UI Simplification */
.iv-head-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.iv-center.iv-collapsed{padding-bottom:10px}
.iv-center.iv-collapsed > :not(.section-head){display:none!important}
.payslip-photo-consolidated{display:grid;grid-template-columns:minmax(220px,.7fr) minmax(0,1.3fr);gap:7px;align-items:center}
.payslip-photo-consolidated label{grid-column:1/-1}
.payslip-photo-consolidated .hint{align-self:center}
.secondary-center-note{padding:7px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--panel2);color:var(--muted);font-size:var(--fs-8);margin-bottom:9px}
@media(max-width:700px){.payslip-photo-consolidated{grid-template-columns:1fr}}

/* v0.6.1 Image / Payslip Verification Import */
.iv-center{display:block}
.iv-modebar{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.iv-top-grid{display:grid;grid-template-columns:minmax(180px,.6fr) minmax(260px,1fr) minmax(340px,1.2fr);gap:8px;align-items:end}
.iv-top-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:end}
.iv-work-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:9px;margin:10px 0}
.iv-preview-card,.iv-text-card{min-width:0;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.iv-image-preview{min-height:330px;display:flex;align-items:center;justify-content:center;overflow:auto;border:1px dashed var(--line);border-radius:10px;background:var(--panel);padding:8px}
.iv-image-preview img{max-width:100%;max-height:520px;object-fit:contain;border-radius:8px}
.iv-textarea{width:100%;min-height:330px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.45}
.iv-summary-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}
.iv-summary-grid>div{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.iv-summary-grid span,.iv-summary-grid b,.iv-summary-grid small{display:block}
.iv-summary-grid span{font-size:var(--fs-8);color:var(--muted)}
.iv-summary-grid b{font-size:var(--fs-14);margin:4px 0 2px}
.iv-summary-grid small{font-size:var(--fs-7);color:var(--muted)}
.iv-result-pass{background:#eff9f1}.iv-result-warn{background:#fff8e7}.iv-result-missing{background:#fff0f0}
.iv-field-detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0}
.iv-field-card{padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.iv-field-card span,.iv-field-card b,.iv-field-card small{display:block}.iv-field-card span{font-size:var(--fs-8);color:var(--muted)}
.iv-field-card b{font-size:var(--fs-12);margin:4px 0}.iv-field-card small{font-size:var(--fs-7);color:var(--muted)}
.iv-field-card.pass{border-color:#9ed5aa;background:#eff9f1}.iv-field-card.warn{border-color:#e7c56f;background:#fff8e7}
.iv-actionbar{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.iv-privacy-note code{font-size:var(--fs-8)}
@media(max-width:1050px){.iv-top-grid,.iv-work-grid{grid-template-columns:1fr}.iv-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.iv-field-detail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.iv-summary-grid,.iv-field-detail{grid-template-columns:1fr}}

/* v0.6.0-R2 Annual Center Detail Drilldown */
.annual-center-month-block{display:grid;gap:0}
.annual-center-month-block + .annual-center-month-block{margin-top:1px}
.annual-center-recent-row .month{
 flex-direction:column;gap:6px;align-items:stretch;justify-content:center
}
.annual-center-recent-row .month .month-label{
 display:block;text-align:center;font-size:var(--fs-16);font-weight:900
}
.annual-drill-toggle{
 width:100%;min-height:30px;padding:5px 7px;font-size:var(--fs-7)
}
.annual-drilldown{
 display:none;margin:-1px 0 7px;padding:11px;border:1px solid var(--line);
 border-top-style:dashed;border-radius:0 0 12px 12px;background:var(--panel2)
}
.annual-drilldown.open{display:block}
.annual-drill-head{
 display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px
}
.annual-drill-head b{font-size:var(--fs-12)}
.annual-drill-head span{font-size:var(--fs-8);color:var(--muted)}
.annual-drill-sourcebar{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:9px
}
.annual-drill-sourcebar>div{
 padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel)
}
.annual-drill-sourcebar span,.annual-drill-sourcebar b,.annual-drill-sourcebar small{display:block}
.annual-drill-sourcebar span{font-size:var(--fs-7);color:var(--muted)}
.annual-drill-sourcebar b{font-size:var(--fs-10);margin:3px 0}
.annual-drill-sourcebar small{font-size:var(--fs-7);color:var(--muted);line-height:1.35}
.annual-drill-grid{
 display:grid;grid-template-columns:1fr 1fr;gap:9px
}
.annual-drill-section{
 min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px
}
.annual-drill-section.full{grid-column:1/-1}
.annual-drill-title{
 display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px
}
.annual-drill-title b{font-size:var(--fs-10)}
.annual-drill-title span{font-size:var(--fs-7);color:var(--muted)}
.annual-drill-list{display:grid;gap:4px}
.annual-drill-item{
 display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr) auto;
 gap:7px;align-items:center;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)
}
.annual-drill-item .name{font-weight:800;min-width:0}
.annual-drill-item .meta{font-size:var(--fs-7);color:var(--muted);min-width:0}
.annual-drill-item .amount{font-weight:900;text-align:right;white-space:nowrap}
.annual-drill-item.disabled{opacity:.55}
.annual-ot-detail-head{
 display:grid;grid-template-columns:100px minmax(0,1fr) 80px minmax(0,1.15fr) 120px 95px;
 gap:7px;padding:5px 7px;color:var(--muted);font-size:var(--fs-7);font-weight:800
}
.annual-ot-detail-row{
 display:grid;grid-template-columns:100px minmax(0,1fr) 80px minmax(0,1.15fr) 120px 95px;
 gap:7px;align-items:center;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)
}
.annual-ot-detail-row .date{font-weight:900}
.annual-ot-detail-row .meta,.annual-ot-detail-row .source{font-size:var(--fs-7);color:var(--muted)}
.annual-ot-detail-row .hours,.annual-ot-detail-row .amount{text-align:right;font-weight:900;white-space:nowrap}
.annual-ot-detail-row.history{border-style:dashed}
.annual-drill-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
@media(max-width:1050px){
 .annual-drill-sourcebar{grid-template-columns:repeat(2,minmax(0,1fr))}
 .annual-drill-grid{grid-template-columns:1fr}
 .annual-drill-section.full{grid-column:auto}
 .annual-ot-detail-head{display:none}
 .annual-ot-detail-row{grid-template-columns:100px 1fr 80px 100px}
 .annual-ot-detail-row .source,.annual-ot-detail-row .segments{grid-column:2/-1}
}
@media(max-width:700px){
 .annual-drill-sourcebar{grid-template-columns:1fr}
 .annual-ot-detail-row{grid-template-columns:1fr}
 .annual-ot-detail-row .source,.annual-ot-detail-row .segments{grid-column:auto}
 .annual-ot-detail-row .hours,.annual-ot-detail-row .amount{text-align:left}
}

/* v0.6.0-R1 Annual recent-month integrity */
.annual-center-recent{
 display:grid;gap:8px
}
.annual-center-recent-row{
 display:grid;grid-template-columns:110px minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.15fr) minmax(0,1.3fr);
 gap:8px;align-items:stretch;padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--panel)
}
.annual-center-recent-row .month{
 display:flex;align-items:center;justify-content:center;font-size:var(--fs-16);font-weight:900;
 border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px
}
.annual-center-recent-col{
 border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 9px;min-width:0
}
.annual-center-recent-col .h{display:block;font-size:var(--fs-7);font-weight:800;color:var(--muted);margin-bottom:4px}
.annual-center-recent-col .v{display:block;font-size:var(--fs-10);font-weight:900}
.annual-center-recent-col .s{display:block;font-size:var(--fs-7);color:var(--muted);margin-top:3px;line-height:1.35}
.annual-center-recent-col.money .v{font-size:var(--fs-12)}
.annual-center-recent-col.money .s{display:flex;flex-direction:column;gap:2px}
.annual-center-recent-col .kline{display:block}
.annual-center-recent-col.ot .v{white-space:nowrap}
.annual-center-recent-row.pending .month{border-style:dashed}
@media(max-width:1320px){
 .annual-center-recent-row{
  grid-template-columns:110px repeat(2,minmax(0,1fr)) repeat(2,minmax(0,1fr));
 }
 .annual-center-recent-row .money-block{grid-column:2 / -1}
}
@media(max-width:980px){
 .annual-center-recent-row{
  grid-template-columns:110px 1fr 1fr;
 }
 .annual-center-recent-row .money-block{grid-column:auto}
}
@media(max-width:700px){
 .annual-center-recent-row{
  grid-template-columns:1fr;
 }
 .annual-center-recent-row .month{justify-content:flex-start}
}

/* v0.6.0 Annual Compensation Center */
.annual-center-overview{grid-column:1/-1}
.annual-center-head-actions,.advanced-analytics-head-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.annual-center-toolbar{
 display:grid;grid-template-columns:minmax(180px,.55fr) auto auto 1fr;gap:8px;align-items:end;margin:10px 0
}
.annual-center-kpis{
 display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px
}
.annual-center-kpis>div{
 padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);min-width:0
}
.annual-center-kpis span,.annual-center-kpis b,.annual-center-kpis small{display:block}
.annual-center-kpis span{font-size:var(--fs-8);color:var(--muted)}
.annual-center-kpis b{font-size:var(--fs-16);margin:4px 0 2px}
.annual-center-kpis small{font-size:var(--fs-7);color:var(--muted)}
.annual-center-flow{
 display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.3fr);
 gap:7px;align-items:center;margin:10px 0 6px
}
.annual-center-flow>div{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.annual-center-flow span,.annual-center-flow b{display:block}
.annual-center-flow span{font-size:var(--fs-8);color:var(--muted)}
.annual-center-flow b{font-size:var(--fs-13);margin-top:4px}
.annual-center-flow em{font-style:normal;font-weight:900;text-align:center;color:var(--muted)}
.annual-center-flow .result{border-width:2px}
.annual-center-double-count-note{margin-bottom:10px}
.annual-center-lower{display:grid;grid-template-columns:1.45fr .8fr;gap:9px}
.annual-center-panel{padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.annual-center-recent{display:grid;gap:5px}
.annual-center-recent-row{
 display:grid;grid-template-columns:85px minmax(0,1fr) minmax(0,1fr) 95px 95px;
 gap:7px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel)
}
.annual-center-recent-row .month{font-weight:900}
.annual-center-recent-row .meta{font-size:var(--fs-8);color:var(--muted)}
.annual-center-recent-row .money{text-align:right;font-weight:900;white-space:nowrap}
.annual-center-state{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.annual-center-state>div{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.annual-center-state span,.annual-center-state b{display:block}
.annual-center-state span{font-size:var(--fs-8);color:var(--muted)}
.annual-center-state b{font-size:var(--fs-12);margin-top:3px}
#payslipAnalytics::before{
 content:"年度薪資中心的進階／歷史分析";display:block;margin-bottom:9px;padding:7px 10px;
 border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:var(--fs-8);font-weight:800;background:var(--panel2)
}
@media(max-width:1050px){
 .annual-center-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .annual-center-lower{grid-template-columns:1fr}
 .annual-center-recent-row{grid-template-columns:80px 1fr 1fr 90px}
 .annual-center-recent-row .actual{display:none}
}
@media(max-width:700px){
 .annual-center-toolbar,.annual-center-kpis,.annual-center-flow,.annual-center-state{grid-template-columns:1fr}
 .annual-center-flow em{display:none}
 .annual-center-recent-row{grid-template-columns:1fr}
 .annual-center-recent-row .actual{display:block}
 .annual-center-recent-row .money{text-align:left}
}

/* v0.5.2 Payroll Attendance & OT Integration */
.pati-panel{
 margin:12px 0;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)
}
.pati-cycle{
 display:grid;grid-template-columns:1.5fr .8fr 1fr;gap:7px;margin:9px 0
}
.pati-cycle>div,.pati-summary-grid>div{

}
.pati-cycle span,.pati-cycle b,.pati-summary-grid span,.pati-summary-grid b,.pati-summary-grid small{display:block}
.pati-cycle span,.pati-summary-grid span{font-size:var(--fs-8);color:var(--muted)}
.pati-cycle b{font-size:var(--fs-11);margin-top:3px}
.pati-summary-grid{
 display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px
}
.pati-summary-grid b{font-size:var(--fs-14);margin:4px 0 2px}
.pati-summary-grid small{font-size:var(--fs-7);color:var(--muted)}
.pati-actions{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}

.pati-recent-row{

}

.pati-recent-row .meta,.pati-recent-row .ot{font-size:var(--fs-8);color:var(--muted)}

 .pati-recent-row{grid-template-columns:1fr}

}

/* v0.5.0 Payroll Compensation Integration */
.pci-rolebar{
 display:flex;justify-content:space-between;gap:10px;align-items:center;

.pci-role-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pci-flow-grid{

 gap:7px;align-items:stretch;margin:10px 0 14px
}
.pci-flow-card{
 border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:11px 12px;min-width:0

function validateAdditionDraft(){

 if(!name){box.className="validation error";box.textContent="請輸入加項名稱。";return false}
 if(reservedCompName(name)){box.className="validation error";box.textContent="此名稱屬於系統自動計算薪資項目，不能另外建立，避免重複計薪。";return false}

function snapshotIsDirty(snapshot){

 if(snapshot.importedHistory)return false;

function esc(v){

}
function payslipSourceState(p){

 const currentMonth=$("payrollMonth").value||monthNow();
 if(recordCompanyId(p)===currentCompanyId()&&p.month===currentMonth&&snapshotIsDirty(src))return {code:"dirty",label:"Payroll 已變更 · Snapshot 待重新結算"};
 if(src.fingerprint!==p.sourceFingerprint)return {code:"stale",label:"需同步"};

function payslipVariance(p){
 if(p.actualNet===null||p.actualNet===undefined||p.actualNet==="")return null;
 return Number(p.actualNet)-Number(p.payable||0);
}
function payslipVerifyState(p){
 const v=payslipVariance(p);
 if(v===null)return {code:"pending",label:"待核對"};
 if(Math.abs(v)<0.005)return {code:"ok",label:"一致"};

}
function analyticsRows(year){
 if(!year)return [];
 const snaps=moduleRead("settlement",{year}),pays=moduleRead("payslip",{year}),months=new Set();
 snaps.forEach(r=>months.add(r.month));
 pays.forEach(p=>months.add(p.month));
 return [...months].sort().map(month=>{
  const snap=snaps.find(r=>r.month===month)||null;
  const pay=pays.find(p=>p.month===month)||null;
  const expected=snap?Number(snap.payable||0):pay?Number(pay.payable||0):0;
  const actual=pay&&pay.finalized&&(pay.actualNet!==null&&pay.actualNet!==undefined&&pay.actualNet!=="")?Number(pay.actualNet):null;
  const variance=actual===null?null:actual-expected;
  return {
   month,profileName:snap?.profileName||pay?.profileName||"—",expected,actual,variance,
   overtime:Number(snap?.overtime??pay?.overtime??0),customStructureTotal:Number(snap?.customStructureTotal??pay?.customStructureTotal??0),bonusTotal:Number(snap?.bonusTotal??pay?.bonusTotal??0),
   allowanceTotal:Number(snap?.allowanceTotal??pay?.allowanceTotal??0),
   taxableDeduct:Number(snap?.taxableDeduct??pay?.taxableDeduct??0),
   taxFreeDeduct:Number(snap?.taxFreeDeduct??pay?.taxFreeDeduct??0),
   deduct:Number(snap?.deduct??pay?.deduct??0),
   overtimeHours:Number(snap?.overtimeHours??pay?.overtimeHours??0),
   incidentDays:Number(snap?.incidentDays??pay?.incidentDays??0),
   verify:pay?(pay.finalized?payslipVerifyState(pay):{code:"pending",label:"待結案"}):{code:"pending",label:"未建薪資單"},
   finalized:!!pay?.finalized,hasPayslip:!!pay,hasSnapshot:!!snap,sourceState:pay?payslipSourceState(pay):null
  };
 });
}

function drawAnnualPayslipChart(year,rows){
 const svg=$("annualPayslipChart"),empty=$("annualChartEmpty");
 const map=Object.fromEntries(rows.map(r=>[Number(r.month.slice(5,7)),r]));
 const vals=Array.from({length:12},(_,i)=>map[i+1]||null);
 const nums=vals.flatMap(r=>r?[r.expected,...(r.actual===null?[]:[r.actual])]:[]);
 const max=Math.max(...nums,0);
 if(max<=0){
  svg.innerHTML='<text x="430" y="120" text-anchor="middle" class="chart-label">尚無年度薪資資料</text>';
  empty.style.display="block";empty.textContent=`${year} 尚無年度薪資資料`;return;
 }
 empty.style.display="none";
 const W=860,H=250,left=48,right=20,top=18,bottom=32,w=W-left-right,h=H-top-bottom,step=w/11;
 const y=v=>top+h-(v/max)*h;
 const grid=[0,.25,.5,.75,1].map(t=>{const yy=top+h-h*t;return `<line x1="${left}" y1="${yy}" x2="${W-right}" y2="${yy}" stroke="#e8ece9"/><text x="5" y="${yy+3}" class="chart-label">${Math.round(max*t/1000)}K</text>`}).join("");
 const expPts=vals.map((r,i)=>r?{x:left+i*step,y:y(r.expected),v:r.expected}:null);
 const actPts=vals.map((r,i)=>r&&r.actual!==null?{x:left+i*step,y:y(r.actual),v:r.actual}:null);
 const runs=pts=>{let all=[],run=[];pts.forEach(p=>{if(!p){if(run.length)all.push(run);run=[]}else run.push(p)});if(run.length)all.push(run);return all};
 const lines=(pts,stroke)=>runs(pts).map(run=>run.length>1?`<polyline points="${run.map(p=>`${p.x},${p.y}`).join(" ")}" fill="none" stroke="${stroke}" stroke-width="3"/>`:"").join("");
 const expDots=expPts.filter(Boolean).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#6a7a70"/>`).join("");
 const actDots=actPts.filter(Boolean).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#169c54"/>`).join("");
 const labels=Array.from({length:12},(_,i)=>`<text x="${left+i*step}" y="${H-8}" text-anchor="middle" class="chart-label">${i+1}</text>`).join("");
 svg.innerHTML=`${grid}${lines(expPts,"#74847a")}${lines(actPts,"#169c54")}${expDots}${actDots}${labels}
 <text x="${left}" y="12" class="chart-label">灰：系統應付　綠：公司實領</text>`;
}
function exportAnalyticsCsv(){
 const year=$("analyticsYear").value,rows=analyticsRows(year);
 if(!rows.length){alert("此年度沒有可匯出的薪資資料。");return}
 const cols=["月份","班別","系統應付","公司實領","差異","加班費","自訂固定薪資","獎金","額外津貼","應稅薪資扣項","免稅薪資扣項","薪資扣項合計","加班時數","全勤事件日","核對狀態","結案"];
 const csv=[cols.join(",")].concat(rows.map(r=>[
  r.month,`"${String(r.profileName).replace(/"/g,'""')}"`,r.expected,
  r.actual===null?"":r.actual,r.variance===null?"":r.variance,
  r.overtime,r.customStructureTotal,r.bonusTotal,r.allowanceTotal,r.taxableDeduct,r.taxFreeDeduct,r.deduct,r.overtimeHours,r.incidentDays,r.verify.label,r.finalized?"已結案":""
 ].join(","))).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`SalaryMate_${year}_Payslip_Analytics.csv`;a.click();URL.revokeObjectURL(url);
}

function currentVerification(){
 const src=sourceSnapshot($("payslipMonth").value);
 const actualRaw=$("payslipActualNet").value;
 const actual=actualRaw===""?null:Number(actualRaw);
 if(!src)return {expected:0,actual,variance:null,status:"待核對"};
 const variance=actual===null?null:actual-Number(src.payable||0);
 return {
  expected:Number(src.payable||0),actual,variance,
  status:variance===null?"待核對":Math.abs(variance)<0.005?"一致":"有差異"
 };
}
function renderVerificationPreview(){
 const v=currentVerification(),box=$("verifyVarianceBox");
 $("verifyExpected").textContent=money2(v.expected);
 $("verifyActual").textContent=v.actual===null?"尚未輸入":money2(v.actual);
 $("verifyVariance").textContent=v.variance===null?"—":(v.variance>=0?"+":"")+money2(v.variance).replace("NT$ ","NT$ ");
 box.className="verify-box"+(v.status==="一致"?" good":v.status==="有差異"?" warn":"");
 renderPayslipBuilderVisual();
}

function payslipWeekdayZh(dateStr){

async function compressPayslipImage(file){
 if(!file||!file.type.startsWith("image/"))throw new Error("僅支援圖片格式。");
 const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error("讀取圖片失敗"));r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("無法解析圖片"));i.src=raw});
 const maxSide=1600,scale=Math.min(1,maxSide/Math.max(img.width,img.height));
 const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
 canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
 let dataUrl=canvas.toDataURL("image/jpeg",0.78);
 if(attachmentStorageSize(dataUrl)>1800000)dataUrl=canvas.toDataURL("image/jpeg",0.62);
 if(attachmentStorageSize(dataUrl)>1800000)throw new Error("圖片壓縮後仍過大，請改用較小的照片。");
 return {name:file.name,type:"image/jpeg",size:attachmentStorageSize(dataUrl),dataUrl};
}
