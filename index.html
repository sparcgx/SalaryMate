<!doctype html>
<html lang="zh-Hant-TW" data-glass-mode="fine">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="個人薪資管理：整合月薪與派遣時薪、工時出勤、請假、年終試算、加薪紀錄與年度收入對帳">
  <meta name="application-name" content="個人薪資管理">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="薪資管理">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <title>個人薪資管理 v4.3.2-RC.1</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=4.3.0">
  <link rel="stylesheet" href="./glass.css?v=4.3.2-RC.1">
  <script src="./glass.js?v=4.3.2-RC.1"></script>
  <link rel="stylesheet" href="./reconcile.css?v=4.3.2-RC.1">
  <script src="./reconcile.js?v=4.3.2-RC.1"></script>
  <script src="./copy-month.js?v=4.3.2-RC.1"></script>
  <script src="./comp-time.js?v=4.3.2-RC.1"></script>
  <link rel="stylesheet" href="./annual-analysis.css?v=4.3.2-RC.1">
  <script src="./annual-analysis.js?v=4.3.2-RC.1"></script>
</head>
<body data-ui-mode="standard" data-color-theme="teal">
  <a class="skip-link" href="#mainContent">跳到主要內容</a>
  <dialog id="securityCover" class="security-cover" aria-modal="true" aria-labelledby="securityCoverTitle" hidden aria-live="polite" aria-busy="false">
    <section class="security-cover-card" aria-labelledby="securityCoverTitle">
      <div class="brand-mark security-cover-mark" aria-hidden="true">薪</div>
      <h2 id="securityCoverTitle">個人薪資管理已鎖定</h2>
      <p data-security-message>正在確認裝置安全狀態…</p>
      <button class="btn btn-primary" type="button" data-security-unlock>使用裝置解鎖</button>
      <button class="btn" type="button" data-security-leave>返回主畫面</button>
    </section>
  </dialog>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">薪</div>
        <div>
          <h1>個人薪資管理 <span class="version">v4.3.2-RC.1</span></h1>
          <p>薪資、工時出勤、請假與年度對帳，資料只保存在目前裝置</p>
        </div>
      </div>
      <div class="top-actions">
        <label class="sr-only" for="companyFilter">目前公司</label>
        <select id="companyFilter" class="top-select"></select>
        <label class="sr-only" for="yearFilter">年度篩選</label>
        <select id="yearFilter" class="top-select"></select>
        <div class="menu-wrap">
          <button id="dataMenuButton" class="btn" type="button" aria-label="開啟功能與設定" aria-expanded="false" aria-controls="dataMenu" title="功能與設定">⋯</button>
          <div id="dataMenu" class="menu" hidden>
            <div class="menu-section">
              <span class="menu-label">系統設定</span>
              <button type="button" data-action="manage-companies">▣ 公司管理</button>
              <button type="button" data-action="open-interface-settings">◫ 介面與版面</button>
            </div>
            <hr>
            <div class="menu-section">
              <span class="menu-label">備份與匯出</span>
              <button type="button" data-action="export-csv">▦ 匯出薪資 CSV</button>
              <button type="button" data-action="export-leave-csv">休 匯出請假 CSV</button>
              <button type="button" data-action="export-attendance-csv">率 匯出出勤分析 CSV</button>
              <button type="button" data-action="export-json">⬇ 備份全部資料</button>
              <label class="menu-file-trigger" role="button" tabindex="0">⬆ 還原 JSON 備份<input id="jsonImport" class="sr-only" type="file" accept="application/json,.json" aria-label="選擇 JSON 備份檔" tabindex="-1"></label>
            </div>
            <hr>
            <div class="menu-section">
              <span class="menu-label">資料維護</span>
              <button type="button" data-action="data-health">✓ 資料完整性健檢</button>
              <button type="button" data-action="clear-data" style="color:var(--rose)">⌫ 清除本機資料</button>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" type="button" data-action="add-record">＋ <span class="btn-label-optional">記一筆</span></button>
      </div>
    </div>
  </header>

  <div class="nav-shell">
    <nav class="nav-inner" aria-label="主要功能">
      <div class="nav-group" role="group" aria-label="主要工作流程">
        <button class="tab-btn active" type="button" data-tab="dashboard">首頁</button>
        <button class="tab-btn" type="button" data-tab="overtime">快速登記</button>
        <button class="tab-btn" type="button" data-tab="records">薪資</button>
        <button class="tab-btn" type="button" data-tab="tax">年度總覽</button>
        <button class="tab-btn" type="button" data-tab="companies">公司管理</button>
        <button class="tab-btn nav-action" type="button" data-action="open-interface-settings">設定</button>
      </div>
    </nav>
  </div>

  <main id="mainContent" tabindex="-1" aria-label="主要內容"></main>

  <dialog id="appDialog" aria-labelledby="dialogTitle">
    <div id="dialogContent"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./bootstrap.js?v=4.3.2-RC.1"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).then(registration => registration.update()).catch(() => {});
      });
    }
  </script>
</body>
</html>
